<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cena Kalkul">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">

    <title>Kalkulačka 2x-0.01</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --input-bg: #2c2c2e;
            --accent: #0a84ff;
            --success: #32d74b;
            --danger: #ff453a;
            --text: #ffffff;
            --text-dim: #8e8e93;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: env(safe-area-inset-top) 20px 20px 20px;
            display: flex; 
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .calc-card {
            background: var(--card);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-size: 0.85rem;
            padding-left: 5px;
        }

        input { 
            width: 100%; 
            padding: 20px; 
            border: none; 
            background: var(--input-bg); 
            color: var(--text); 
            font-size: 2.5rem; 
            font-weight: 700;
            border-radius: 16px; 
            box-sizing: border-box; 
            outline: none;
            text-align: center;
            -webkit-appearance: none;
        }

        .result-box { 
            margin-top: 25px; 
            padding: 25px; 
            background: var(--input-bg); 
            border-radius: 20px; 
            text-align: center;
            border: 1px solid #38383a;
        }

        .result-label { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 5px; }
        .result-value { font-size: 3.5rem; font-weight: 800; color: var(--success); }

        .history { 
            margin-top: 25px; 
            max-height: 180px; 
            overflow-y: auto; 
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px;
        }

        .history-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px; 
            border-bottom: 1px solid #2c2c2e;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 1rem;
        }
        .history-item:last-child { border-bottom: none; }
        .h-in { color: var(--text-dim); }
        .h-out { color: var(--success); font-weight: bold; }

        .btn-reset { 
            width: 100%; 
            margin-top: 20px; 
            padding: 18px; 
            background: var(--danger); 
            border: none; 
            color: white; 
            border-radius: 16px; 
            font-weight: 700; 
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-reset:active {
