<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kalkulačka 2x</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .calc-card { width: 100%; max-width: 400px; background: #1c1c1e; padding: 20px; border-radius: 20px; }
        label { display: block; color: #8e8e93; margin-bottom: 10px; font-size: 0.9rem; }
        input { 
            width: 100%; padding: 15px; border: none; background: #2c2c2e; 
            color: #fff; font-size: 2.5rem; border-radius: 12px; box-sizing: border-box; outline: none;
        }
        .result-box { margin-top: 20px; padding: 20px; background: #2c2c2e; border-radius: 15px; text-align: center; }
        .result-value { font-size: 3.5rem; font-weight: bold; color: #32d74b; }
        .history { margin-top: 20px; max-height: 150px; overflow-y: auto; font-family: monospace; color: #8e8e93; }
        button { width: 100%; margin-top: 20px; padding: 15px; background: #ff3b30; border: none; color: #fff; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="calc-card">
    <label>VSTUP (x):</label>
    <input type="text" id="inputX" inputmode="decimal" placeholder="0" autofocus autocomplete="off">
    
    <div class="result-box">
        <div id="output" class="result-value">0.00</div>
    </div>

    <div class="history" id="history"></div>
    <button onclick="location.reload()">RESET</button>
</div>

<script>
    const input = document.getElementById('inputX');
    const output = document.getElementById('output');
    const historyDiv = document.getElementById('history');

    input.addEventListener('input', function() {
        // Sanatizace vstupu: nahrazení čárky tečkou a odstranění nečíselných znaků
        let val = this.value.replace(',', '.');
        let x = parseFloat(val);
        
        if (!isNaN(x)) {
            let res = (x * 2) - 0.01;
            let formatted = res.toFixed(2);
            output.innerText = formatted;
            
            // Logování historie
            clearTimeout(this.timeout);
            this.timeout = setTimeout(() => {
                const entry = document.createElement('div');
                entry.innerText = `${x} -> ${formatted}`;
                historyDiv.prepend(entry);
            }, 1000);
        } else {
            output.innerText = "0.00";
        }
    });
</script>

</body>
</html>
